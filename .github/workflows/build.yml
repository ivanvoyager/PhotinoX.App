name: Build

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore --nologo

      - name: Build
        run: dotnet build -c Release --no-restore --nologo -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack (nupkg + snupkg, prerelease)
        run: dotnet pack src/PhotinoX.App/PhotinoX.App.csproj -c Release --no-build -o artifacts --nologo /p:IncludeSymbols=true /p:SymbolPackageFormat=snupkg /p:VersionSuffix="pre.${{ github.run_number }}"

      - name: Upload nupkg
        uses: actions/upload-artifact@v7
        with:
          name: photinox-app-nupkg
          path: artifacts/*.nupkg

      - name: Upload snupkg
        uses: actions/upload-artifact@v7
        with:
          name: photinox-app-snupkg
          path: artifacts/*.snupkg